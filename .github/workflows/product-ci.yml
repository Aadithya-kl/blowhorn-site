name: Product CI

# Runs the product repository's own CI (its ci.yml: the Python suite, the
# desktop typecheck, lint, test and build, and the Rust engine tests) on this
# public repository's free runners. The product repository is private and has no Actions minutes, so
# nothing runs there; this workflow checks it out at one commit instead.
#
# The logs here are public, so they must never show private code:
#   - every command's output goes to a log under RUNNER_TEMP that is never
#     printed, uploaded or cached (.github/scripts/product-ci/run.py)
#   - the step output is fixed labels, exit statuses and pass/fail counts only
#   - no cache, no artifact, no job summary (the commands run without
#     GITHUB_STEP_SUMMARY and the other file-command variables); the checkout
#     keeps no credential
#   - DMG_SOURCE_TOKEN (read-only) is used by the product checkout step alone
# A failure says which step failed; run `make tests` in a product checkout to
# see why.
#
# Run: gh workflow run product-ci.yml -R blowhorn-ai/blowhorn-site -f ref=<40-char commit sha>
# The result is reported on the product commit as the "product-ci" status.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Product commit to test (full 40-character SHA)"
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Product commit to test (full 40-character SHA)"
        required: true
        type: string
      caller:
        description: >
          Calling workflow id (set by build-dmg). A non-empty value gives this
          run its own concurrency group and never cancels another. Leave unset
          for a manual Product CI run.
        required: false
        type: string
        default: ""
    secrets:
      DMG_SOURCE_TOKEN:
        required: true

run-name: Product CI ${{ inputs.ref }}

permissions:
  contents: read

# Manual Product CI still cancels an in-progress run of the same ref.
# A build-dmg call passes `caller` so this run gets its own group (caller plus
# this run id) and cancel-in-progress is false. Adhoc and signed calls of the
# same SHA therefore cannot cancel each other, and neither can cancel a manual
# Product CI run of that SHA.
#
# Do not detect a reusable call with github.event_name. In a called workflow
# that value is the caller's event (workflow_dispatch or repository_dispatch
# for build-dmg), never workflow_call, so a run-id suffix keyed on
# event_name == 'workflow_call' is never added. github.event.workflow is also
# not enough: it is set for workflow_dispatch, but a repository_dispatch
# payload has no workflow field, and that is the path make release uses.
# Pin: .github/scripts/test_product_ci_run.py (ProductCiConcurrencyTest).
concurrency:
  group: product-ci-${{ inputs.ref }}-${{ inputs.caller && format('{0}-{1}', inputs.caller, github.run_id) || 'manual' }}
  cancel-in-progress: ${{ !inputs.caller }}

jobs:
  python:
    name: python (py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the requested commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full 40-character commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the product commit (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blowhorn-ai/blowhorn
          ref: ${{ inputs.ref }}
          token: ${{ secrets.DMG_SOURCE_TOKEN }}
          path: product
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # The product's asset-manifest test measures videos with ffprobe, and the
      # runner image does not ship ffmpeg.
      - name: Install ffmpeg (ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null

      - name: Python suite (output withheld)
        run: make product-ci SUITE=python PRODUCT_DIR=product PRODUCT_CI_LOG="$RUNNER_TEMP/product-ci/python.log"

  desktop:
    name: desktop (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the requested commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full 40-character commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the product commit (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blowhorn-ai/blowhorn
          ref: ${{ inputs.ref }}
          token: ${{ secrets.DMG_SOURCE_TOKEN }}
          path: product
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Desktop checks (output withheld)
        run: make product-ci SUITE=desktop PRODUCT_DIR=product PRODUCT_CI_LOG="$RUNNER_TEMP/product-ci/desktop.log"

  rust:
    name: rust (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check the requested commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full 40-character commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the product commit (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blowhorn-ai/blowhorn
          ref: ${{ inputs.ref }}
          token: ${{ secrets.DMG_SOURCE_TOKEN }}
          path: product
          persist-credentials: false

      - name: Install Rust 1.85
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.85.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rust suite (output withheld)
        run: make product-ci SUITE=rust PRODUCT_DIR=product PRODUCT_CI_LOG="$RUNNER_TEMP/product-ci/rust.log"
