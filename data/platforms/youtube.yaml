# Supported actions on YouTube. See linkedin.yaml for the shared rules.
# Behavior and limits restate the product's docs/reference/platforms/youtube.md;
# the daily ceilings are its per-profile figures.
key: youtube
name: YouTube
weight: 8
logo: assets/platforms/youtube-simple-icons.svg
docs: /docs/reference/platforms/youtube/
reach: Your own signed-in browser, through the Blowhorn extension, once you turn on YouTube
actions:
  - id: post
    behavior: Uploads a video through YouTube Studio with its title, description and visibility (private unless you choose unlisted or public), or as a Short. With Community set to yes, it publishes a post on your channel's Posts tab instead.
    limits: At most 3 uploads and 2 Posts tab posts per profile a day. A Short longer than 3 minutes or wider than it is tall is refused before anything opens. Check each upload in YouTube Studio.
  - id: comment
    behavior: Comments on the YouTube video you point it at.
    limits: At most 10 a day per profile. A comment with an @name in it is refused. A scheduled run never comments; it waits for a run you start.
  - id: reply
    behavior: Replies to the YouTube comment you point it at, by the comment's own link.
    limits: At most 10 a day per profile. A reply to a reply, or one with an @name in it, is refused. A scheduled run never replies.
  - id: amplify
    behavior: Likes a video from each of your profiles.
    limits: At most 20 likes a day per profile. A scheduled run never likes; it waits for a run you start.
  - id: analytics
    behavior: Reads your channel's and videos' figures through the YouTube Analytics and Data APIs, with the profile's own OAuth consent.
    limits: Read-only. A profile without the consent is skipped. YouTube figures are kept for 30 days.
